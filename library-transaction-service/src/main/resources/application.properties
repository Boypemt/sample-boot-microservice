spring.application.name=library-transaction-service
server.port=8100

# Its own database, in memory, separate from the book database.
spring.datasource.url=jdbc:h2:mem:transactiondb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# TODO: (step 2) Join the naming server. The same three lines as book-service:
#
#   eureka.client.register-with-eureka=true
#   eureka.client.fetch-registry=true
#   eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
#
# fetch-registry matters more here than it did for book-service: this service
# has to READ the list to find out where library-book-service is.

# TODO: (step 5) Do not wait forever for the other service. Add:
#
#   feign.client.config.default.connectTimeout=2000
#   feign.client.config.default.readTimeout=2000
#
# Two seconds, then give up. Without a timeout, one slow service can hold up
# every request in this one until nothing works at all.

# ---------------------------------------------------------------------------
# Already set for you: making Eureka quick enough for a classroom.
#
# The defaults are slow on purpose - they are tuned for a datacentre, not a
# lesson. A service waits 40 seconds before it first announces itself, callers
# re-read the list every 30 seconds, and the load balancer caches it for another
# 35. A freshly started system can therefore take well over a minute before the
# first call works, and the error in the meantime looks exactly like a bug in
# your own code.
#
# Five seconds each cuts that down a lot, but it is never instant: a new copy
# still has to boot, announce itself, and be picked up by the caller. Expect to
# wait a few tens of seconds, not a minute and a half.
# ---------------------------------------------------------------------------
eureka.client.registry-fetch-interval-seconds=5
eureka.client.initial-instance-info-replication-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=5
spring.cloud.loadbalancer.cache.ttl=5s
