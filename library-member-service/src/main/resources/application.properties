# The name other services will use to find this one. Not a computer name - a
# name in the naming server's list.
spring.application.name=library-book-service
server.port=8070

# Its own database, in memory. No other service can reach it.
spring.datasource.url=jdbc:h2:mem:bookdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Load data.sql AFTER Hibernate has created the tables. Since Spring Boot 2.5 the
# scripts run first by default, and then data.sql fails with "Table BOOK not
# found".
spring.jpa.defer-datasource-initialization=true

# TODO: (step 1) Join the naming server. Add these three lines:
#
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
#
# register-with-eureka  = put me on the list
# fetch-registry        = give me a copy of the list

# ---------------------------------------------------------------------------
# Already set for you: make Eureka quick enough for a classroom.
#
# By default a service waits 40 seconds before it first tells the naming server
# it exists, and callers re-read the list every 30 seconds. So a freshly started
# system can take well over a minute before the first call works - and the error
# in the meantime looks exactly like a bug in your code. Even with these lines it
# is not instant, so give it a few tens of seconds.
# ---------------------------------------------------------------------------
eureka.client.initial-instance-info-replication-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=5

# How long the naming server waits, after the last renewal, before deciding this
# copy is gone. The default is 90 seconds - a long time to stand in front of a
# class explaining why half the rows in the list came back empty.
#
# It matters most in step 6. Stop one of the two copies and the naming server
# still lists it until this expires, so the load balancer keeps sending it every
# other call, and those calls fail.
#
# This is only the FIRST of four timers, though - see naming-server. Measured end
# to end, a stopped copy still takes about 40 seconds to disappear completely.
# Do not promise the class fifteen.
eureka.instance.lease-expiration-duration-in-seconds=15
