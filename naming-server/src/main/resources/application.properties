# The naming server. Already finished - nothing to change here.
spring.application.name=naming-server
server.port=8761

# The naming server IS the list. It must not register with itself, and it has
# nothing to fetch.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# ---------------------------------------------------------------------------
# Two settings that only make sense in a classroom. Both are about how fast a
# service that has STOPPED disappears from the list.
#
# Self-preservation is the interesting one. If too many services stop renewing
# at once, Eureka assumes the network broke rather than the services, and keeps
# everything on the list rather than risk emptying it. That is right in a
# datacentre with hundreds of instances. Here there are three, so stopping one
# copy crosses the threshold immediately - and the dead copy stays on the list
# for as long as the server is running. Callers keep being sent to it.
#
# The eviction sweep is the other half: even once a lease has expired, the
# server only removes it on the next sweep, which is every 60 seconds by
# default.
#
# In production, leave both alone.
# ---------------------------------------------------------------------------
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=5000

# And the third one, which is easy to miss. Even after the server has removed a
# dead copy, it keeps serving a CACHED answer to everyone who asks for the list -
# for 30 seconds by default. Without this line, dropping the lease timeout does
# almost nothing, because the callers go on being told the old list.
eureka.server.response-cache-update-interval-ms=5000
